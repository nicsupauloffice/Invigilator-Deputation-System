<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invigilator Deputation System</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182230;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:clamp(1.4rem,3vw,2.2rem);margin:0}header p{color:#617083;margin:.35rem 0 1rem}.panel{background:white;border:1px solid #dce3eb;border-radius:14px;padding:22px;margin:18px 0;box-shadow:0 4px 18px #162b4210}button{border:0;border-radius:9px;background:#174d86;color:white;padding:11px 16px;font-weight:650;cursor:pointer}button.secondary{background:#e6edf5;color:#1a3655}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}nav button{background:#e2e9f1;color:#18314d}nav button.active{background:#174d86;color:white}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;background:white}th,td{padding:10px;border-bottom:1px solid #e5ebf1;text-align:left;white-space:nowrap}th{background:#eef3f8}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:grid;gap:5px;font-size:.9rem;color:#42546a}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:white}.status{padding:10px 0;color:#38536c}footer{padding:24px 0;color:#718096;font-size:.85rem}@media(max-width:600px){.wrap{padding:14px}header{align-items:flex-start}.panel{padding:15px}}

</style></head><body><main class="wrap"><header><div><h1>Invigilator Deputation System</h1><p>Administrator workspace</p></div><button id="refresh">Refresh</button></header><section id="auth" class="panel"><h2>Administrator sign-in</h2><p>Enter administrator email and password.</p><form id="loginform"><div class="formgrid"><label>Administrator email<input id="adminemail" type="email" value="dio-spl@nic.in" required autocomplete="username"></label><label>Password<input id="adminpassword" type="password" required autocomplete="current-password"></label></div><div class="toolbar"><button type="submit">Sign in</button></div></form><p id="authmsg" class="status"></p></section><section id="app" hidden><nav id="tabs"></nav><div id="content"></div></section><footer>Invigilator Deputation System · Private administrator application</footer></main><script>
// Set this to the deployed Apps Script Web App URL ending in /exec.
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2FClxFvUlZGg6UiFe0K_FPJiFMU8Oj8Rt5eSWMNgvobXmDr0UWuPM_yGMbly1EEMZdg/exec';
// Create a Google OAuth 2.0 Web client ID (Google Cloud Console) and paste it here.
let session='';
const tables={Centres:['Centre Code','Centre Name','Centre Address','Block','Sub Division','District','Required Capacity'],Exams:['Exam Name','Exam Date','Exam From Date','Exam To Date','Exam Time','Exam Shift','Exam Joining Time','Reporting Date','Reporting Time','Exam Office Name','Exam Officer Name','Reserve Option','Party Gender Constraint','Duty Option'],Invigilators:['Pin Number','Name','Designation','Sex','Mobile Number','Office Name','Office Address','Office Code','Posting Block']};
let state={data:null,table:'Centres'};
const $=s=>document.querySelector(s);function request(params){return new Promise((resolve,reject)=>{if(GAS_URL.startsWith('PASTE_'))return reject(Error('Configure GAS_URL in app.js first.'));const cb='tpdsCb'+Date.now()+Math.floor(Math.random()*1000);const script=document.createElement('script');const timeout=setTimeout(()=>{cleanup();reject(Error('Backend timed out. Check deployment URL and administrator access.'));},20000);function cleanup(){clearTimeout(timeout);delete window[cb];script.remove()}window[cb]=res=>{cleanup();res&&res.ok?resolve(res):reject(Error(res?.error||'Request failed'))};script.onerror=()=>{cleanup();reject(Error('Could not connect to Apps Script.'))};script.src=GAS_URL+'?'+new URLSearchParams({...params,session,callback:cb}).toString();document.body.appendChild(script);});}
function renderTabs(){const names=['Centres','Exams','Invigilators','Assignments'];$('#tabs').innerHTML=names.map(n=>`<button class="${n===state.table?'active':''}" data-tab="${n}">${n}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.table=b.dataset.tab;renderTabs();render()});}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const d=state.data;if(!d)return;const table=state.table;let records=d[table]?.rows||[];let html='<div class="panel"><div class="toolbar">';if(table!=='Assignments')html+='<button id="add">Add record</button>';html+='<button class="secondary" id="pins">Generate sequential codes/PINs</button>';if(table==='Assignments')html+='<button id="csvmain">Download Main CSV</button><button id="csvreserve">Download Reserve CSV</button>';html+='<button class="secondary" id="random">Run randomization</button><button class="secondary" id="lock">'+(d.locked?'Unlock':'Lock')+' randomization</button></div><div id="status" class="status">'+(d.locked?'Randomization locked':'Editing enabled')+'</div>';
if(table==='Assignments'){html+='<div class="tablewrap"><table><thead><tr>'+tablesAssignments().map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+records.map(x=>'<tr>'+tablesAssignments().map(h=>'<td>'+esc(x.record[h])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}else{const headers=tables[table];html+='<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+records.map(x=>'<tr>'+headers.map(h=>'<td>'+esc(x.record[h])+'</td>').join('')+`<td><button class="secondary edit" data-row="${x.row}">Edit</button> <button class="secondary del" data-row="${x.row}">Delete</button></td></tr>`).join('')+'</tbody></table></div>';}
html+='</div><div id="editor"></div>';$('#content').innerHTML=html;
if($('#add'))$('#add').onclick=()=>editor(table,{});$('#pins').onclick=()=>run({action:'generatePins',table});$('#random').onclick=()=>run({action:'randomize'});$('#lock').onclick=()=>run({action:'lock',lock:String(!d.locked)});if($('#csvmain'))$('#csvmain').onclick=()=>csv('Main');if($('#csvreserve'))$('#csvreserve').onclick=()=>csv('Reserve');document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>editor(table,records.find(x=>x.row===Number(b.dataset.row)).record,Number(b.dataset.row)));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(confirm('Delete this row?'))run({action:'delete',table,row:b.dataset.row})});}
function tablesAssignments(){return ['PIN','Name','Designation','Sex','Mobile Number','Office Name','Office Address','Office Code','Posting Block','Centre Code','Centre Name','Centre Address','Block','Sub Division','District','Pool','Exam Name'];}
function editor(table,record,row){const headers=tables[table];$('#editor').innerHTML='<div class="panel"><h2>'+(row?'Edit':'Add')+' '+table+'</h2><form id="recordform"><div class="formgrid">'+headers.map(h=>`<label>${esc(h)}<input name="${esc(h)}" value="${esc(record[h])}" ${h==='Pin Number'||h==='Centre Code'?'readonly':''}></label>`).join('')+'</div><div class="toolbar"><button>Save record</button><button type="button" class="secondary" id="cancel">Cancel</button></div></form></div>';$('#cancel').onclick=()=>$('#editor').innerHTML='';$('#recordform').onsubmit=e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));if(row)obj._row=row;run({action:'save',table,record:JSON.stringify(obj)});};}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href);}
async function csv(pool){try{const r=await request({action:'exportCsv',pool});download(r.filename,r.csv)}catch(e){alert(e.message)}}
async function run(params){try{const r=await request(params);state.data=r.data||r;renderTabs();render();}catch(e){alert(e.message)}}
async function load(){try{const r=await request({action:'bootstrap'});state.data=r.data;$('#auth').hidden=true;$('#app').hidden=false;renderTabs();render();}catch(e){$('#authmsg').textContent=e.message;}}
$('#loginform').onsubmit=async e=>{e.preventDefault();$('#authmsg').textContent='Signing in…';try{const enteredPassword=$('#adminpassword').value;const r=await request({action:'login',email:$('#adminemail').value,password:enteredPassword});session=r.session;if(r.mustChange){const current=enteredPassword;const next=prompt('First login: set a new password (minimum 10 characters):');if(next===null)return;const changed=await request({action:'changePassword',currentPassword:current,newPassword:next});session='';alert(changed.message);return;}await load();}catch(err){$('#authmsg').textContent=err.message;}};
$('#refresh').onclick=()=>{if(session)load();else $('#authmsg').textContent='Please sign in first.';};

</script></body></html>
